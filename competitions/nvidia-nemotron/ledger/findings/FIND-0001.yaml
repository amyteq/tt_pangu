notes: >-
  The evidence is a contrast rather than a single number, and that is what raises it above
  a hypothesis: the same merge machinery over strong+weak members regressed (0.82), every
  single-adapter add-on tied or trailed (0.83-0.85), and only the comparable+complementary
  soup exceeded the backbone (0.86). The later eq-aug result sharpened it further - souping
  a hard-tail-WEAK member produced 0.85, below both parents - so "comparable" has to be
  read as comparable on the hard tail, not only on the aggregate.

