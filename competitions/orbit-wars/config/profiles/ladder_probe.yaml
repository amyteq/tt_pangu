  OW_PROD_MULT: 0.0
  OW_INFLIGHT_CAP: 1.2
  OW_CAP_EARLY: 3.2
  OW_CAP_LATE: 1.3
  OW_4P_MODE: 0
  OW_4P_ATK_SCALE: 0.5
