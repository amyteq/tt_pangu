name: Claude Routine

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Claude"
        required: true
        type: string
      max_turns:
        description: "Max Claude turns"
        required: false
        default: "30"
        type: string
  schedule:
    # 每天 Melbourne 时间约 06:00；UTC 19:00 可能受 DST 影响，按需调整
    - cron: "0 16 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-routine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  routine:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: |
            --model claude-opus-4-7
            --max-turns ${{ inputs.max_turns || '100' }}

          prompt: |
            Read CLAUDE.md and docs/milestones/README.md.

            If this run was manually triggered, execute this task:
            ${{ inputs.task }}

            If this run is scheduled, do BOTH of the following, in order:

            (A) Review open issues against recently merged PRs and close the ones
            that are already fixed:
            - list PRs merged into the default branch in roughly the last 7 days
              (`gh pr list --state merged --base main --limit 50`)
            - for each open issue, check whether a merged PR already resolves it.
              Only close an issue when the evidence is unambiguous, e.g. a merged
              PR body / commit says "Closes #N" / "Fixes #N", or the issue's stated
              acceptance criteria are demonstrably met by the merged diff.
            - when closing, post a comment that cites the PR number/URL and the
              specific acceptance criterion or `file:line` it satisfies, then
              `gh issue close`.
            - if resolution is ambiguous or the issue is only partially addressed,
              do NOT close it — leave a comment noting the related PR instead, and
              do not infer decisions from ambiguous human comments.
            - never reopen issues, never strip decision:* gates, and never touch
              issues labeled ai:blocked or decision:needed.

            (B) Then pick up at most one issue to work on:
            - inspect open issues labeled ai:ready
            - choose at most one small, well-scoped issue
            - do not work on issues labeled ai:blocked or decision:needed
            - create a branch and PR if code/docs changed
            - run relevant tests
            - do not merge
            - do not read secrets
            - do not perform Kaggle submissions, remote kernel pushes, production Supabase migrations, or destructive operations

            Always summarize:
            - issues closed as already-fixed (cite the merged PR for each)
            - selected issue/task
            - changed files
            - tests run
            - PR link or reason no PR was created
