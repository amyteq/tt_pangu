id: FIND-0001
competition: nvidia-nemotron
statement: >-
  A model soup of comparable, complementary same-base fine-tunes beats each member. Train
  N>=3 diverse fine-tunes of one base near the same loss basin, weight-average their LoRA
  deltas, SVD-truncate back to the rank cap. Members must be comparable (similar score)
  AND complementary (different data or seed); a strong+weak mix dilutes instead.
