name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-db:
    name: no-db pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -e ".[dev]" fastapi httpx
      - name: pytest (no DB)
        run: python -m pytest tests/ services/decision_api/tests -v

  live-db:
    name: live-db pytest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      KCA_DB_TARGET: local
    steps:
      - uses: actions/checkout@v4
      - name: confirm secrets reachable
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret missing — skipping live-db."
            exit 0
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -e ".[dev]" fastapi httpx
      - name: apply migrations
        run: |
          for f in supabase/migrations/000*.sql; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: pytest (live DB)
        run: python -m pytest tests/ services/decision_api/tests -v

  lint:
    name: ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  ui:
    name: ui build + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install
        run: pnpm -C ui install --frozen-lockfile
      - name: lint
        run: pnpm -C ui lint
      - name: typecheck
        run: pnpm -C ui typecheck
      - name: build
        run: pnpm -C ui build
      - name: test
        run: pnpm -C ui test --run
