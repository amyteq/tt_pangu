notes: >-
  `screen.require_repro: fail` is deliberate and is the most useful thing in this record.
  ADR-0022 §5 defines require_repro as "seed + artifact path + exact command recorded",
  and EXP-0002 has no seed, no config hash and no artifact hash. So the campaign's best
  submission would NOT pass its own hard gate today. It is recorded as a fail rather than
  as unknown because the fields are known to be absent, not merely unread.

  `scenario: null` because ADR-0022 §5's scenario table did not exist in June 2026. Read
  against it, this dispatch was scenario 0 - the competition closed 23:59 UTC the same
  day, so it was inside its closing window and promotion would now be human-gated.

  `external_id: null` is a platform fact, not an omission: submissions.md records that
  Kaggle's submissions API exposes no numeric submission id for this competition, and the
  (date + description) pair is the key. This is exactly why `external_id` is nullable and
  why the ledger cannot depend on it for identity - `ref` does that job.

  `budget_reservations: {}` because no reservation machinery existed; ADR-0022 §6 now
  requires one reservation per capping scope before dispatch.

  Timestamp conflict, unresolved and recorded: competition.yaml and submissions.md's
  final-selection section both give 2026-06-15 03:22 for this submission, while
  submissions.md's campaign table row gives "2026-06-15 ~12". 03:22 UTC is used here
  because two sources agree on it and it is the more precise. Drift D11.
