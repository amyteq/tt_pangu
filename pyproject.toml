[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-pangu"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "nbformat>=5.9",
    "PyYAML>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "ruff>=0.4"]
# Required by the M13 Kaggle-replay eval suites (kaggle_replay_titanic /
# kaggle_replay_spaceship_titanic / kaggle_replay_house_prices). Lean
# install (`.[dev]`) keeps these out; CI installs `.[dev,eval]` so the
# suites can register and run.
eval = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4"]

[project.scripts]
kca = "tools.kca.kca:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# ruff only lints/formats Python — Markdown (Claude skill definitions, worklog
# dumps, docs) is never touched by it. worklogs/ holds generated session dumps;
# exclude it so a stray file there can never trip the linter / CI / pre-push gate.
extend-exclude = [
    "worklogs",
    # Orbit Wars experiment workspace: frozen agent snapshots (regression baselines),
    # a third-party public opponent, and throwaway arena/sweep scripts. The maintained
    # submission agent (competitions/orbit-wars/agent/main.py) is NOT excluded.
    "competitions/orbit-wars/agent/versions",
    "competitions/orbit-wars/arena",
]
