$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/amyteq/tt_pangu/blob/main/contracts/strategy.yaml"
title: Strategy
description: >-
  The approved envelope the inner loop runs inside. Discussion #185 §3: what the
  human approves once is "a scope, clearly bounded" — a frozen validation split,
  a set of permitted changes, and caps on experiments, GPU time and submissions —
  not each experiment.

  A Strategy is therefore the join between the outer loop and the inner one, and
  `scope` is the part an Experiment must stay inside. A Finding can end a strategy
  and start a new one; that is the last edge of §5's chain.

type: object
additionalProperties: false
required:
  - id
  - competition
  - statement
  - derived_from
  - scope
  - status
  - in_force_from
  - in_force_to
  - supersedes
  - evidence
  - provenance
  - recorded_at
  - notes
properties:
  id:
    type: string
    pattern: "^STRATEGY-[0-9]{3,}$"
  competition:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  statement:
    description: The direction in one or two sentences — what we are trying and why this, now.
    type: string
    minLength: 1
  derived_from:
    description: The Decision, Idea and Finding records that produced this strategy.
    type: array
    items:
      type: string
      pattern: "^(DEC|IDEA|FIND)-[0-9]{3,}$"
  scope:
    description: >-
      The bounded envelope. `frozen_split_id` is load-bearing: changing the CV
      protocol means a NEW split_id and a new strategy, never a silent edit —
      otherwise scores from two protocols land on one improvement curve
      (discussion #185 §6).
    type: object
    additionalProperties: false
    required:
      - frozen_split_id
      - permitted_changes
      - forbidden_changes
      - max_experiments
      - max_gpu_hours
      - max_submissions
    properties:
      frozen_split_id:
        type: [string, "null"]
      permitted_changes:
        description: Variables an experiment inside this strategy may change.
        type: array
        items:
          type: string
      forbidden_changes:
        description: Variables it may not, each with the reason implied by the name.
        type: array
        items:
          type: string
      max_experiments:
        type: [integer, "null"]
        minimum: 0
      max_gpu_hours:
        type: [number, "null"]
        minimum: 0
      max_submissions:
        type: [integer, "null"]
        minimum: 0
  status:
    enum: [active, superseded, retired]
  in_force_from:
    type: [string, "null"]
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  in_force_to:
    description: Null while active.
    type: [string, "null"]
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  supersedes:
    type: [string, "null"]
    pattern: "^STRATEGY-[0-9]{3,}$"
  evidence:
    type: array
    items:
      type: string
  provenance:
    enum: [live, backfilled]
  recorded_at:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  notes:
    type: [string, "null"]
