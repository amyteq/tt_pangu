current_blocker: "none — competition closed 2026-06-15, private LB released 2026-06-16, post-mortem written (postmortems/2026-06-16-final-postmortem.md). Held finding for the post-mortem: the campaign's best PRIVATE score (eq-aug 0.86/0.86, full-coverage single-epoch SFT) was only discovered in the post-deadline window — the coverage lever existed before the deadline and was not tried in time"
next_task: "Write up the transferable findings: (1) model-soup of comparable+complementary adapters beats each member (0.85 -> 0.86); (2) coverage is the lever, dose is not (eq-aug 0.86/0.86 at full coverage x1; x2 regresses to 0.82 private); (3) eq-aug does not soup — the soup lever needs hard-tail-robust members; (4) public->private was robust, and the one hedge that paid (+0.01) was the weaker-public b2. Then: T12 local metric, KCA-core YAML (#85)"
