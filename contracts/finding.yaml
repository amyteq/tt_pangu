$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/amyteq/tt_pangu/blob/main/contracts/finding.yaml"
title: Finding
description: >-
  A conclusion worth carrying forward, and the last edge of discussion #185 §5's
  chain: Score -> Finding -> (new Strategy). A Finding either changes what we do
  next in this competition (`new_strategy`) or transfers to the next one
  (`transfer_scope`), and if it does neither it is a note, not a finding.

  `insight_ref` points at the human-readable entry in
  competitions/<slug>/insights.md. The md file stays the narrative — it holds the
  argument, the counter-examples and the literature; this record holds the part
  another competition's loop has to be able to query.

type: object
additionalProperties: false
required:
  - id
  - competition
  - statement
  - type
  - confidence
  - status
  - evidence
  - from_experiments
  - from_scores
  - transfer_scope
  - new_strategy
  - supersedes
  - insight_ref
  - provenance
  - recorded_at
  - notes
properties:
  id:
    type: string
    pattern: "^FIND-[0-9]{4,}$"
  competition:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
  statement:
    description: The finding itself, stated so it can be wrong.
    type: string
    minLength: 1
  type:
    description: Matches the `type:` vocabulary insights.md already uses, plus `technique`.
    enum: [fact, hypothesis, technique, tactic, anti-pattern, rule, bug]
  confidence:
    enum: [low, medium, high]
  status:
    enum: [candidate, validated, refuted, superseded]
  evidence:
    description: Paths, ledger ids, file:line or issue URLs. A finding with no evidence is an opinion.
    type: array
    minItems: 1
    items:
      type: string
  from_experiments:
    type: array
    items:
      type: string
      pattern: "^EXP-[0-9]{4,}$"
  from_scores:
    type: array
    items:
      type: string
      pattern: "^SCORE-[0-9]{4,}$"
  transfer_scope:
    description: >-
      Where this is expected to hold beyond this competition. Null means
      competition-specific — which is a legitimate finding, just not a reusable one.
    type: [string, "null"]
  new_strategy:
    description: The Strategy this finding produced, closing §5's loop.
    type: [string, "null"]
    pattern: "^STRATEGY-[0-9]{3,}$"
  supersedes:
    type: [string, "null"]
    pattern: "^FIND-[0-9]{4,}$"
  insight_ref:
    description: The insights.md entry id, e.g. `INS-004`.
    type: [string, "null"]
  provenance:
    enum: [live, backfilled]
  recorded_at:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  notes:
    type: [string, "null"]
