# Permissive dev profile: bash + filesystem allowed; submissions still gated.
- operation: kaggle_submit
  default_decision: ask
  reason: Still gated even in dev — Kaggle is external.
  audit_required: true
- operation: kaggle_push
  default_decision: ask
  reason: Still gated even in dev.
  audit_required: true
- operation: supabase_migrate
  default_decision: ask
  reason: Remote DB writes always gated.
  audit_required: true
- operation: gh_pr_merge
  default_decision: ask
  reason: Merge is irreversible.
  audit_required: true
- operation: bash
  default_decision: allow
  reason: Dev profile permits shell.
- operation: read_file
  default_decision: allow
- operation: write_file
  default_decision: allow
- operation: edit_file
  default_decision: allow
- operation: create_artifact
  default_decision: allow
- operation: run_tests
  default_decision: allow
- operation: web_fetch
  default_decision: allow
- operation: web_search
  default_decision: allow
- operation: litellm_call
  default_decision: allow
- operation: git_commit
  default_decision: allow
- operation: git_push
  default_decision: allow
- operation: gh_pr_create
  default_decision: allow
# M11 — CTF approval operations (ADR-0017). Even in dev, challenge_run
# and flag_submit stay on `ask` (no auto-allow for live submission paths).
# network_egress stays deny-default; widen via ctf_scopes.target_urls.
- operation: challenge_run
  default_decision: ask
  reason: Executing a solver against an authorized CTF target — gate even in dev.
  audit_required: true
- operation: flag_submit
  default_decision: ask
  reason: Flag submission to a CTF event API — always gated.
  audit_required: true
- operation: network_egress
  default_decision: deny
  reason: Egress outside ctf_scopes.target_urls is denied; widen scope row to allow.
  audit_required: true
  conditional_allow:
    when_in_scope: ask   # if request URL ∈ ctf_scopes.target_urls
