notes: >-
  This is why Score is a separate record rather than a field on the Submission: the
  private value did not exist when the submission was written. It was released
  2026-06-16, the day AFTER the competition closed, and backfilled into submissions.md
  then. The soup aged 0.86 -> 0.85; public -> private was robust with no shake-up (private
  top 0.92).

  `is_eligible: true` and `selected_for_final: true` are what make this the competition's
  `best` under ADR-0022 §3. The campaign's best PRIVATE score was not this one: nemo-eq-aug
  scored 0.86 / 0.86 but was submitted 2026-06-16 09:22, in the post-deadline 100/day late
  window, so it is `is_eligible: false` and counts for nothing. A ledger that ranked by
  private_score alone would promote the ineligible row - which is the concrete reason
  eligibility is a field and not a comment.

  `private_rank` / `private_total` are null: the private standing was never read per row.
  `public_total: 4350` is the denominator at the time `public_rank: 150` was read; a rank
  without its denominator is not a result.
